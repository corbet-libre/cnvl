[package]
name = "cnvl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cnvl"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
ckmg = { git = "https://github.com/corbet-foss/ckmg", branch = "main" }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
