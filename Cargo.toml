[package]
name = "cnvl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cnvl"
publish = false

[lib]
crate-type = ["rlib"]
# All behavior vectors are integration tests; there is no separate unit harness.
test = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[dependencies]
cgrd = { git = "https://github.com/corbet-foss/cgrd", branch = "main", default-features = false }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
getrandom = "0.4"
rand_chacha = "0.10"
rand_core = "0.10"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".github/coverage-runtime" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
