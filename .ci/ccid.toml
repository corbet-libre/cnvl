schema = 1
project = "cnvl"

# Preserved hosted Linux gates live here; no pre-existing .ci/ccid.toml existed,
# so every hosted Linux check below is the preserved contract (resolve/cargo-update
# excluded per prior-cohort rule; registry/live reads stay FRESH outside cache).
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["python3", "-c", "import selenium; print(selenium.__version__)"], ["python3", "-m", "pip", "freeze"], ["curl", "--version"], ["node", "--version"], ["wasm-pack", "--version"], ["chromedriver", "--version"], ["google-chrome", "--version"], ["clang", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_env = ["CNVL_WASM_CLANG"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "wasm-coverage.json", "wasm-coverage.lcov", "wasm-coverage.txt"]

[render]
tool_revision = "2db9dddd5e43d48b6cdbb2728818957db65acf5e"
tool_sha256 = "f5a672c714ca91a87e230713086379f06ad6df6d0ccd9112ee5fbf0cd44f95e7"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
